# Deep sleep after 30 minutes idle. Any key wakes it; that first press is not typed.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Pads "009" and "010" (P0.09/P0.10) are NFC pins by default; we use them as key columns.
CONFIG_NFCT_PINS_AS_GPIOS=y

# Some SuperMini clones have an unreliable 32.768 kHz crystal. Use the chip's
# internal RC clock instead. Costs a little battery; remove on a genuine nice!nano.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
